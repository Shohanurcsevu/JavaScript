<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoice Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f8f9fa;
    }
    .invoice-container {
      max-width: 600px;
      margin: auto;
      background: #fff;
      padding: 20px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
    }
    h2 {
      text-align: center;
      color: #333;
    }
    .items, .summary {
      margin-top: 20px;
    }
    .items div, .summary div {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .items div {
      border-bottom: 1px solid #ddd;
      padding-bottom: 8px;
    }
    .total {
      font-weight: bold;
      color: #000;
    }
    .thank-you {
      text-align: center;
      margin-top: 20px;
      font-size: 1.2em;
      color: #007bff;
    }
  </style>
</head>
<body>
  <div class="invoice-container">
    <h2>Invoice</h2>
    <div id="invoice-content"></div>
  </div>

  <script src="script.js"></script> 
</body>
</html>
